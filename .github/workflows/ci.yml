# Builds and tests every push and pull request: the type checks, lint and the
# production build (`npm run build`), then the tests. The Google client secret
# is not given, so the build warns and cannot connect to Google Drive, which
# the tests do not need.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          # The same major version as on the machine releases are made on.
          node-version: 25
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
